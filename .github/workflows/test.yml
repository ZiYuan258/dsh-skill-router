name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, declared explicitly. Without this block the run gets the repository
# default for GITHUB_TOKEN, which is broader than a checkout-and-test job needs — and any
# code that executes inside the job (a third-party action, a hijacked dependency) inherits
# whatever that token can do. This job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing leg must not cancel the others. GitHub's fail-fast cancels the rest as
      # soon as the first leg fails, so a real failure on every platform gets reported as
      # one failure plus a row of "cancelled" — which is exactly how a genuine three-leg
      # failure was once read as a single failure at the time.
      fail-fast: false
      matrix:
        # Windows is a first-class target, not an afterthought: resolvePath() carries
        # drive-letter and backslash handling, the directory-link recipe is a junction,
        # and the docs' main path is PowerShell. Testing only Linux left that unverified.
        os: [ubuntu-latest, windows-latest]
        node: ['20.x', '22.x', '24.x']
    steps:
      # Pinned to a major version tag, never @main: a floating ref lets the action's
      # owner change what runs in this job without a commit here.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # No install step on purpose: the plugin has zero runtime dependencies and the
      # suite builds its own fixture library, so a bare clone is enough to test it.
      - run: npm test
