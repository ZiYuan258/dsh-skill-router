name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, declared explicitly. Without this block the run gets the repository
# default for GITHUB_TOKEN, which is broader than a checkout-and-test job needs — and any
# code that executes inside the job (a third-party action, a hijacked dependency) inherits
# whatever that token can do. This job only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No install step on purpose: the plugin has zero runtime dependencies and the
      # suite builds its own fixture library, so a bare clone is enough to test it.
      - run: npm test
